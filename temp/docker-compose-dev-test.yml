# docker-compose-dev-test.yml

# -------------------------------------------------------------
# [설정 정의 구역]
# -------------------------------------------------------------
x-db-config: &db-config
  POSTGRES_DB: postgres
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgrespassword
  PGPASSWORD: postgrespassword

  # [수정] 통합 일반 사용자 계정 정보 정의 (단일 계정)
  DB_USER: mjusugangsincheonghelperuser
  DB_PASSWORD: mjusugangsincheonghelperpassword

x-ports:
  db-port: &db-port "5432:5432"
  pgadmin-port: &pgadmin-port "8005:80"
  redis-port: &redis-port "6379:6379"
  redis-commander-port: &redis-commander-port "8006:8081"

x-pgadmin-config: &pgadmin-config
  PGADMIN_DEFAULT_EMAIL: admin@admin.com
  PGADMIN_DEFAULT_PASSWORD: "1253"

# -------------------------------------------------------------
# [서비스 구성 구역]
# -------------------------------------------------------------
services:
  db:
    build:
      context: .
      dockerfile: ./docker/postgres/Dockerfile
    container_name: mjusugangsincheonghelpercontainer_postgres
    environment:
      <<: *db-config
    ports:
      - *db-port
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements,pg_cron
      -c cron.database_name=mjusugangsincheonghelperdb_dev
      -c logging_collector=on
      -c log_destination=stderr
      -c log_directory=log
      -c log_filename=postgresql.log
      -c log_min_messages=warning
    restart: always

  pgadmin:
    image: dpage/pgadmin4
    container_name: mjusugangsincheonghelper_pgadmin
    environment:
      <<: *pgadmin-config
    ports:
      - *pgadmin-port
    volumes:
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json
    depends_on:
      - db
    restart: always

  redis:
    image: redis:7-alpine
    container_name: mjusugangsincheonghelper_redis
    ports:
      - *redis-port
    volumes:
      - ./data/redis:/data
    restart: always

  redis-commander:
    image: ghcr.io/joeferner/redis-commander:latest
    platform: linux/amd64
    container_name: mjusugangsincheonghelper_redis_commander
    environment:
      REDIS_HOSTS: "local:redis:6379"
    ports:
      - *redis-commander-port
    depends_on:
      - redis
    restart: always
