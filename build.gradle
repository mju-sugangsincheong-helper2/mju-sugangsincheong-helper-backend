plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.2'
	implementation 'io.micrometer:micrometer-registry-prometheus'
	implementation 'net.logstash.logback:logstash-logback-encoder:8.0'
	implementation 'com.google.firebase:firebase-admin:9.10.0'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}

// Pinpoint Agent 설정 — agent jar가 있을 때만 적용
tasks.named('bootRun') {
	if (file("${projectDir}/pinpoint/agent/pinpoint-agent-3.1.1/pinpoint-bootstrap-3.1.1.jar").exists()) {
		jvmArgs(
			"-javaagent:${projectDir}/pinpoint/agent/pinpoint-agent-3.1.1/pinpoint-bootstrap-3.1.1.jar",
			"-Dpinpoint.agentId=dev-local-1",
			"-Dpinpoint.applicationName=mju-sugangsincheong-helper-dev",
			"-Dpinpoint.profiler.profiles.active=local",
			"-Dprofiler.spring.beans.1.scope=post-processor",
			"-Dprofiler.spring.beans.1.base-packages=com.mjusugangsincheonghelper",
			"-Dprofiler.spring.beans.mark.error=true",
			"-Dprofiler.server.excludeurl=/v3/**,/actuator/**",
			"-Dprofiler.sampling.type=PERCENT",
			"-Dprofiler.sampling.percent.sampling-rate=100"
		)
	}
}

// 실행 가능한 jar 는 bootJar 산출물만 사용한다 (plain jar 미생성 → docker 이미지 COPY 단순화)
tasks.named('jar') {
	enabled = false
}

tasks.withType(JavaCompile) {
	options.compilerArgs << "-Xlint:deprecation"
}
