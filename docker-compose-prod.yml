# 운영 환경 docker compose (docker-compose.yml 과 동일 구조)
# - dev 도구 중 pgadmin → pgweb 대체 (내부망용), redis-commander 유지
# - 앱 서비스(backend) 포함. 앞단 프록시가 /api 만 backend 로 전달한다
# - 포트: backend 10020, db 10021, redis 10022, pgweb 10023, redis-commander 10024
# - 기밀은 같은 디렉터리 .env(gitignore)에서 읽는다: DB_URL, DB_USERNAME, DB_PASSWORD,
#   POSTGRES_PASSWORD, REDIS_HOST, JWT_SECRET (+ 선택: CORS/Google/Firebase)
# - 기동 순서: db(healthy) → db-setup(완료) → backend, redis(healthy) → backend

x-variables:
  postgres_db_name: &POSTGRES_DB_NAME "postgres"
  postgres_user: &POSTGRES_USER "postgres"
  prod_db_name: &PROD_DB_NAME "mjusugangsincheonghelperdb_prod"
  pgweb_database_url: &PGWEB_DATABASE_URL "postgres://${DB_USERNAME:?DB_USERNAME required in .env}:${DB_PASSWORD:?DB_PASSWORD required in .env}@db:5432/mjusugangsincheonghelperdb_prod?sslmode=disable"
  backend_container: &BACKEND_CONTAINER "mju-sugangsincheong-helper-backend"
  db_container: &DB_CONTAINER "mju-sugangsincheong-helper-db"
  db_setup_container: &DB_SETUP_CONTAINER "mju-sugangsincheong-helper-db-setup"
  redis_container: &REDIS_CONTAINER "mju-sugangsincheong-helper-redis"
  redis_commander_container: &REDIS_COMMANDER_CONTAINER "mju-sugangsincheong-helper-redis-commander"
  pgweb_container: &PGWEB_CONTAINER "mju-sugangsincheong-helper-pgweb"

  # postgres:17 + pgmq 빌드
  postgres_with_pgmq_inline_dockerfile: &POSTGRES_WITH_PGMQ_INLINE_DOCKERFILE |
    FROM postgres:17
    USER root
    RUN apt-get update && apt-get install -y --no-install-recommends \
        postgresql-server-dev-17 make gcc git ca-certificates \
        && rm -rf /var/lib/apt/lists/* \
        && git clone https://github.com/pgmq/pgmq.git /tmp/pgmq \
        && cd /tmp/pgmq/pgmq-extension && make install \
        && rm -rf /tmp/pgmq \
        && apt-get purge -y --auto-remove make gcc git postgresql-server-dev-17 \
        && rm -rf /var/lib/apt/lists/*
    USER postgres

  # [수정] x-variables 안으로 들여쓰기 맞춤 + IBM Semeru에 curl 설치
  backend_inline_dockerfile: &BACKEND_INLINE_DOCKERFILE |
    FROM eclipse-temurin:21-jdk AS build
    WORKDIR /app
    COPY gradlew settings.gradle build.gradle ./
    COPY gradle ./gradle
    COPY src ./src
    RUN --mount=type=cache,target=/root/.gradle ./gradlew bootJar --no-daemon

    FROM ibm-semeru-runtimes:open-21-jre-jammy
    WORKDIR /app
    USER root
    RUN apt-get update && apt-get install -y --no-install-recommends curl && rm -rf /var/lib/apt/lists/*
    COPY --from=build /app/build/libs/*.jar app.jar
    EXPOSE 8080
    ENTRYPOINT ["java", "-Xtune:virtualized", "-XX:MaxRAMPercentage=75.0", "-jar", "app.jar"]

services:
  db:
    build:
      context: .
      dockerfile_inline: *POSTGRES_WITH_PGMQ_INLINE_DOCKERFILE
    container_name: *DB_CONTAINER
    environment:
      POSTGRES_DB: *POSTGRES_DB_NAME
      POSTGRES_USER: *POSTGRES_USER
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required in .env}
    ports:
      - "10021:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  db-setup:
    image: postgres:17
    container_name: *DB_SETUP_CONTAINER
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: *POSTGRES_USER
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required in .env}
      POSTGRES_DB_NAME: *POSTGRES_DB_NAME
      DB_USER: ${DB_USERNAME:?DB_USERNAME required in .env}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required in .env}
      PROD_DB_NAME: *PROD_DB_NAME
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required in .env}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src/main/resources/schema-prod.sql:/schema-prod.sql:ro
    command: |
      bash -c "
        set -e
        until pg_isready -h $$POSTGRES_HOST -U $$POSTGRES_USER; do
          sleep 1
        done
        echo 'PostgreSQL is up - executing setup commands...'

        psql -h $$POSTGRES_HOST -U $$POSTGRES_USER -d $$POSTGRES_DB_NAME -tAc \"SELECT 1 FROM pg_roles WHERE rolname='$$DB_USER'\" | grep -q 1 || \
        psql -h $$POSTGRES_HOST -U $$POSTGRES_USER -d $$POSTGRES_DB_NAME -c \"CREATE ROLE $$DB_USER WITH LOGIN PASSWORD '$$DB_PASSWORD' SUPERUSER;\"

        if ! psql -h $$POSTGRES_HOST -U $$POSTGRES_USER -d $$POSTGRES_DB_NAME -tAc \"SELECT 1 FROM pg_database WHERE datname='$$PROD_DB_NAME'\" | grep -q 1; then
          echo 'Creating prod database...'
          psql -h $$POSTGRES_HOST -U $$POSTGRES_USER -d $$POSTGRES_DB_NAME -c \"CREATE DATABASE $$PROD_DB_NAME OWNER $$DB_USER;\"
        fi
        psql -h $$POSTGRES_HOST -U $$POSTGRES_USER -d $$PROD_DB_NAME -c \"CREATE EXTENSION IF NOT EXISTS pgmq;\"
        psql -h $$POSTGRES_HOST -U $$POSTGRES_USER -d $$PROD_DB_NAME -c \"ALTER DATABASE $$PROD_DB_NAME SET search_path TO public;\"

        psql -h $$POSTGRES_HOST -U $$POSTGRES_USER -d $$PROD_DB_NAME -v ON_ERROR_STOP=1 -f /schema-prod.sql

        psql -h $$POSTGRES_HOST -U $$POSTGRES_USER -d $$POSTGRES_DB_NAME -c \"ALTER ROLE $$DB_USER SET search_path TO public;\"
        echo 'Database setup complete!'
      "
    restart: "no"

  backend:
    build:
      context: .
      dockerfile_inline: *BACKEND_INLINE_DOCKERFILE
    container_name: *BACKEND_CONTAINER
    environment:
      SPRING_PROFILES_ACTIVE: prod
      INSTANCE_ID: backend
      TZ: Asia/Seoul
      DB_URL: ${DB_URL:?DB_URL required in .env}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME required in .env}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required in .env}
      REDIS_HOST: ${REDIS_HOST:?REDIS_HOST required in .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required in .env (256bit 이상)}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://xn--hq1b21kh2g.com}
      MJU_SUGANGSINCHEONG_HELPER_GOOGLE_CLIENT_ID: ${MJU_SUGANGSINCHEONG_HELPER_GOOGLE_CLIENT_ID:-}
      MJU_SUGANGSINCHEONG_HELPER_GOOGLE_CLIENT_SECRET: ${MJU_SUGANGSINCHEONG_HELPER_GOOGLE_CLIENT_SECRET:-}
      MJU_SUGANGSINCHEONG_HELPER_GOOGLE_REDIRECT_URI: ${MJU_SUGANGSINCHEONG_HELPER_GOOGLE_REDIRECT_URI:-https://xn--hq1b21kh2g.com/login}
      MJU_SUGANGSINCHEONG_HELPER_FIREBASE_ADMIN_PROJECT_ID: ${MJU_SUGANGSINCHEONG_HELPER_FIREBASE_ADMIN_PROJECT_ID:-}
      MJU_SUGANGSINCHEONG_HELPER_FIREBASE_ADMIN_CLIENT_EMAIL: ${MJU_SUGANGSINCHEONG_HELPER_FIREBASE_ADMIN_CLIENT_EMAIL:-}
      MJU_SUGANGSINCHEONG_HELPER_FIREBASE_ADMIN_PRIVATE_KEY: ${MJU_SUGANGSINCHEONG_HELPER_FIREBASE_ADMIN_PRIVATE_KEY:-}
      MJU_SUGANGSINCHEONG_HELPER_FIREBASE_ADMIN_TYPE: ${MJU_SUGANGSINCHEONG_HELPER_FIREBASE_ADMIN_TYPE:-service_account}
      MJU_SUGANGSINCHEONG_HELPER_FIREBASE_ADMIN_PRIVATE_KEY_ID: ${MJU_SUGANGSINCHEONG_HELPER_FIREBASE_ADMIN_PRIVATE_KEY_ID:-}
      MJU_SUGANGSINCHEONG_HELPER_FIREBASE_ADMIN_CLIENT_ID: ${MJU_SUGANGSINCHEONG_HELPER_FIREBASE_ADMIN_CLIENT_ID:-}
    ports:
      - "10020:8080"
    volumes:
      - ./logs:/app/logs
    depends_on:
      db-setup:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      # [수정] curl 기반 포트/응답 확인으로 변경
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: always

  redis:
    image: redis:7-alpine
    container_name: *REDIS_CONTAINER
    ports:
      - "10022:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: always

  redis-commander:
    image: ghcr.io/joeferner/redis-commander:latest
    container_name: *REDIS_COMMANDER_CONTAINER
    environment:
      REDIS_HOSTS: "local:redis:6379"
    ports:
      - "10024:8081"
    depends_on:
      - redis
    restart: always

  pgweb:
    image: sosedoff/pgweb:latest
    container_name: *PGWEB_CONTAINER
    environment:
      PGWEB_DATABASE_URL: *PGWEB_DATABASE_URL
    ports:
      - "10023:8081"
    depends_on:
      db:
        condition: service_healthy
    restart: always

