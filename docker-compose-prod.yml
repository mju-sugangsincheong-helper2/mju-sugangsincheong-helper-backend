  #   image: victoriametrics/victoria-metrics:latest
  #   container_name: mju-sugangsincheong-helper-victoria-metrics
  #   ports:
  #     - "8428:8428"
  #   command:
  #     - "-storageDataPath=/victoria-metrics-data"
  #     - "-retentionPeriod=30d"
  #     - "-memory.allowedPercent=20"
  #     - "-promscrape.config=/etc/prometheus.yml"
  #   volumes:
  #     - ./docker/victoriametrics/prometheus.yml:/etc/prometheus.yml:ro
  #     - victoriametrics_data:/victoria-metrics-data
  #   restart: always

volumes:
  postgres_data:
  redis_data:
  backend_logs:
  # victoria-metrics 활성화 시 함께 해제
  # victoriametrics_data:
