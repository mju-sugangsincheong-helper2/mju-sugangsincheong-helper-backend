# 운영 환경 docker compose (docker-compose.yml 기반)
# - dev 전용 도구(pgadmin, redis-commander) 제외
# - 인프라 지표 수집: victoria-metrics (Spring Boot /actuator/prometheus 스크레이핑, vmui로 조회)
x-variables:
  app_name: &APP_NAME "mju-sugangsincheong-helper"
  postgres_db_name: &POSTGRES_DB_NAME "postgres"
  postgres_user: &POSTGRES_USER "postgres"
  postgres_password: &POSTGRES_PASSWORD "postgrespassword"
  db_user: &DB_USER "mjusugangsincheonghelperuser"
  db_password: &DB_PASSWORD "mjusugangsincheonghelperpassword"
  prod_db_name: &PROD_DB_NAME "mjusugangsincheonghelperdb_prod"
  # Container name anchors
  postgres_container: &POSTGRES_CONTAINER "mju-sugangsincheong-helper-postgres"
  db_setup_container: &DB_SETUP_CONTAINER "mju-sugangsincheong-helper-db-setup"
  redis_container: &REDIS_CONTAINER "mju-sugangsincheong-helper-redis"
  vm_container: &VM_CONTAINER "mju-sugangsincheong-helper-victoria-metrics"
  pgweb_container: &PGWEB_CONTAINER "mju-sugangsincheong-helper-pgweb"

services:
  db:
    image: postgres:16-alpine
    container_name: *POSTGRES_CONTAINER
    environment:
      POSTGRES_DB: *POSTGRES_DB_NAME
      POSTGRES_USER: *POSTGRES_USER
      POSTGRES_PASSWORD: *POSTGRES_PASSWORD
      PGPASSWORD: *POSTGRES_PASSWORD
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  db-setup:
    image: postgres:16-alpine
    container_name: *DB_SETUP_CONTAINER
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: *POSTGRES_USER
      POSTGRES_PASSWORD: *POSTGRES_PASSWORD
      POSTGRES_DB_NAME: *POSTGRES_DB_NAME
      DB_USER: *DB_USER
      DB_PASSWORD: *DB_PASSWORD
      PROD_DB_NAME: *PROD_DB_NAME
      PGPASSWORD: *POSTGRES_PASSWORD
    depends_on:
      db:
        condition: service_healthy
    command: |
      bash -c "
        set -e
        until pg_isready -h $$POSTGRES_HOST -U $$POSTGRES_USER; do
          sleep 1
        done
        echo 'PostgreSQL is up - executing setup commands...'

        # 1. 역할(Role) 존재 여부 체크 후 생성
        psql -h $$POSTGRES_HOST -U $$POSTGRES_USER -d $$POSTGRES_DB_NAME -tAc \"SELECT 1 FROM pg_roles WHERE rolname='$$DB_USER'\" | grep -q 1 || \
        psql -h $$POSTGRES_HOST -U $$POSTGRES_USER -d $$POSTGRES_DB_NAME -c \"CREATE ROLE $$DB_USER WITH LOGIN PASSWORD '$$DB_PASSWORD' SUPERUSER;\"

        # 2. 운영용 DB 존재 여부 체크 후 생성 및 확장 설정
        if ! psql -h $$POSTGRES_HOST -U $$POSTGRES_USER -d $$POSTGRES_DB_NAME -tAc \"SELECT 1 FROM pg_database WHERE datname='$$PROD_DB_NAME'\" | grep -q 1; then
          echo 'Creating prod database...'
          psql -h $$POSTGRES_HOST -U $$POSTGRES_USER -d $$POSTGRES_DB_NAME -c \"CREATE DATABASE $$PROD_DB_NAME OWNER $$DB_USER;\"
        fi
        psql -h $$POSTGRES_HOST -U $$POSTGRES_USER -d $$PROD_DB_NAME -c \"CREATE EXTENSION IF NOT EXISTS pg_stat_statements;\"
        psql -h $$POSTGRES_HOST -U $$POSTGRES_USER -d $$PROD_DB_NAME -c \"CREATE EXTENSION IF NOT EXISTS pg_cron;\"
        psql -h $$POSTGRES_HOST -U $$POSTGRES_USER -d $$PROD_DB_NAME -c \"CREATE EXTENSION IF NOT EXISTS pgmq;\"
        psql -h $$POSTGRES_HOST -U $$POSTGRES_USER -d $$PROD_DB_NAME -c \"CREATE EXTENSION IF NOT EXISTS system_stats;\"
        psql -h $$POSTGRES_HOST -U $$POSTGRES_USER -d $$PROD_DB_NAME -c \"ALTER DATABASE $$PROD_DB_NAME SET search_path TO public;\"

        psql -h $$POSTGRES_HOST -U $$POSTGRES_USER -d $$POSTGRES_DB_NAME -c \"ALTER ROLE $$DB_USER SET search_path TO public, '$$DB_USER';\"
        echo 'Database setup complete!'
      "
    restart: "no"

  redis:
    image: redis:7-alpine
    container_name: *REDIS_CONTAINER
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  # 인프라 지표 수집: Spring Boot /actuator/prometheus 스크레이핑 (vmui: http://localhost:8428)
  victoria-metrics:
    image: victoriametrics/victoria-metrics:latest
    container_name: *VM_CONTAINER
    ports:
      - "8428:8428"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - "-storageDataPath=/victoria-metrics-data"
      - "-retentionPeriod=30d"
      - "-memory.allowedPercent=20"
      - "-promscrape.config=/etc/prometheus.yml"
    volumes:
      - ./docker/victoriametrics/prometheus.yml:/etc/prometheus.yml:ro
      - victoriametrics_data:/victoria-metrics-data
    restart: always

  # DB 관리 UI (가벼운 단일 바이너리, 내부망 전용 — pgadmin 대체)
  # - 접근: ssh -L 8081:localhost:8081 user@server 후 브라우저에서 http://localhost:8081
  pgweb:
    image: sosedoff/pgweb:latest
    container_name: *PGWEB_CONTAINER
    environment:
      DATABASE_URL: postgres://*DB_USER:*DB_PASSWORD@db:5432/*PROD_DB_NAME?sslmode=disable
    ports:
      - "0.0.0.0:8081:8081"
    depends_on:
      db:
        condition: service_healthy
    restart: always

  # 앱 서비스 (백엔드 + 프론트/nginx)
  # TODO: 앱 Dockerfile이 준비되면 주석 해제.
  #   이때 victoria-metrics 스크레이프 대상은 ./docker/victoriametrics/prometheus.yml 에서
  #   host.docker.internal:8080 → app:8080 으로 변경한다.
  # app:
  #   build:
  #     context: .
  #     dockerfile: ./docker/app/Dockerfile
  #   container_name: mju-sugangsincheong-helper-app
  #   environment:
  #     SPRING_PROFILES_ACTIVE: prod
  #     SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/mjusugangsincheonghelperdb_prod
  #     SPRING_DATASOURCE_USERNAME: *DB_USER
  #     SPRING_DATASOURCE_PASSWORD: *DB_PASSWORD
  #     SPRING_DATA_REDIS_HOST: redis
  #   ports:
  #     - "8080:8080"
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #     redis:
  #       condition: service_started
  #   restart: always

volumes:
  postgres_data:
  redis_data:
  victoriametrics_data:
