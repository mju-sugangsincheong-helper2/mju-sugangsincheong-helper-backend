spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/mjusugangsincheonghelperdb_test
    username: mjusugangsincheonghelperuser
    password: mjusugangsincheonghelperpassword

  sql:
    init:
      mode: always
      schema-locations: classpath:schema-view.sql

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  cache:
    type: redis

  data:
    redis:
      host: localhost
      port: 6379

app:
  security:
    # 테스트 클래스패스가 메인 application.yml을 섀도잉하므로 공개 URL 목록을 동일하게 유지해야 한다.
    public-urls:
      - /api/*/auth/guest
      - /api/*/auth/refresh
      - /api/*/auth/login/google/merge
      - /api/*/auth/oauth/start
      - /api/*/auth/token
      - /api/*/auth/config/google
      - /api/*/auth/test-**
      - /api/*/example/**
      - /swagger-ui/**
      - /v3/api-docs/**
      - /*.html
      - /*.js
      - /actuator/**
    public-get-urls:
      - "/api/*/course/sections"
      - "/api/*/course/department"
      - "/api/*/exchange/intents/recent"
      - "/api/*/notices"
    public-post-urls:
      - "/api/*/latency"
    public-put-urls: []
    public-patch-urls: []
    public-delete-urls: []
  auth:
    # dev 런타임과 동일한 복수 모드 유지 (헤더 우선 + 쿠키 폴백)
    token-mode: header, cookie
    cookie-secure: false
    token-in-response: true
  jwt:
    secret: test-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm
    access-token-expiry-ms: 3600000
    refresh-token-expiry-ms: 604800000
    merge-ticket-expiry-ms: 300000
  cache:
    default-ttl: 24h
    ttls:
      system-config: 24h
      exchange-feed: 10m
      exchange-intents: 10m
      exchange-rooms: 10m
      singlegame-rank: 5m
      singlegame-records: 5m
      singlegame-analysis: 5m
  singlegame:
    timing:
      t-enter-main:
        min-ms: 1
        max-ms: 60000
      t-click-course:
        min-ms: 1
        max-ms: 60000
      t-click-yes:
        min-ms: 1
        max-ms: 60000
      t-click-ok:
        min-ms: 1
        max-ms: 60000
  oauth2:
    google:
      client-id: test-client-id
      client-secret: test-client-secret
      redirect-uri: http://localhost:3000/auth/callback
      authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
      token-uri: https://oauth2.googleapis.com/token
  expose-error-details: true
  performance:
    slow-ms: 500
    very-slow-ms: 2000

logging:
  level:
    root: WARN
