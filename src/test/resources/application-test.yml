spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/mjusugangsincheonghelperdb_test
    username: mjusugangsincheonghelperuser
    password: mjusugangsincheonghelperpassword

  sql:
    init:
      mode: always
      schema-locations: classpath:schema-view.sql

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  cache:
    type: redis

  data:
    redis:
      host: localhost
      port: 6379

app:
  auth:
    token-in-response: true
  jwt:
    secret: test-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm
    access-token-expiry-ms: 3600000
    refresh-token-expiry-ms: 604800000
    merge-ticket-expiry-ms: 300000
  cache:
    default-ttl: 24h
    ttls:
      exchange-feed: 10m
      exchange-intents: 10m
      exchange-rooms: 10m
      singlegame-rank: 5m
      singlegame-records: 5m
      singlegame-analysis: 5m
  oauth2:
    google:
      client-id: test-client-id
      client-secret: test-client-secret
      redirect-uri: http://localhost:3000/auth/callback
      authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
      token-uri: https://oauth2.googleapis.com/token
  expose-error-details: true
  performance:
    slow-ms: 500
    very-slow-ms: 2000

logging:
  level:
    root: WARN
