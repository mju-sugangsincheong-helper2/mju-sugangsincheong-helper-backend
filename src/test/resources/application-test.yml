spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/mjusugangsincheonghelperdb
    username: mjusugangsincheonghelperuser
    password: mjusugangsincheonghelperpassword

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  data:
    redis:
      host: localhost
      port: 6379

app:
  auth:
    token-in-response: false
  jwt:
    secret: test-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm
    access-token-expiry-ms: 3600000
    refresh-token-expiry-ms: 604800000
    merge-ticket-expiry-ms: 300000
  oauth2:
    google:
      client-id: test-client-id
      client-secret: test-client-secret
      redirect-uri: http://localhost:3000/auth/callback
      authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
      token-uri: https://oauth2.googleapis.com/token

logging:
  level:
    root: WARN
