spring:
  profiles:
    active: dev
    # active: prod

app:
  security:
    # 공개 URL 목록 (HTTP 메서드 무관) — 엔드포인트 공개/비공개는 여기서만 관리.
    public-urls:
      - /api/*/auth/guest
      - /api/*/auth/refresh
      - /api/*/auth/login/google/merge
      - /api/*/auth/oauth/start
      - /api/*/auth/token
      - /api/*/auth/config/google
      - /api/*/auth/test-**
      - /api/*/example/**
      - /swagger-ui/**
      - /v3/api-docs/**
      - /*.html
      - /*.js
      # actuator: 내부망 전용. 외부 프록시는 /api 경로만 백엔드로 라우팅하므로 외부 노출 아님.
      - /actuator/**
    # HTTP 메서드별 공개 (여기 없는 메서드는 인증 필수)
    public-get-urls:
      - "/api/*/course/sections"
      - "/api/*/course/department"
      - "/api/*/exchange/intents/recent"
      - "/api/*/notices"
    public-post-urls: []
    public-put-urls: []
    public-patch-urls: []
    public-delete-urls: []

  # 스케줄링 실행 풀 — 운영 튜닝 시 프로필 yml에서 오버라이드
  scheduling:
    task:
      pool-size: 2
      thread-name-prefix: "global-scheduler-"
    pgmq:
      pool-size: 2
      thread-name-prefix: "pgmq-worker-"
    multigame:
      pool-size: 4
      thread-name-prefix: "multigame-scheduler-"
  schedule:
    # @Scheduled 크론 — 기본값은 주석의 placeholder에도 내장되어 있음
    pgmq-cleanup:
      cron: "0 30 3 * * *"
    game-ready:
      cron: "55 9/10 * * * *"
    game-start:
      cron: "0 0/10 * * * *"
    game-finish:
      cron: "30 0/10 * * * *"

  # PGMQ 비동기 워커 — 폴링 주기/배치/재시도는 운영 부하 튜닝 대상, 프로필 yml에서 오버라이드
  pgmq:
    notification:
      poll-interval: 1s
      visibility-timeout: 30
      batch-size: 400
      max-retry-count: 5
    cycle-detection:
      poll-interval: 1s
      visibility-timeout: 30
      batch-size: 1
      max-retry-count: 5