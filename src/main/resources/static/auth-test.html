<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OAuth Login Helper</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            width: 100%;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
            font-size: 24px;
        }
        .status {
            text-align: center;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .status.waiting {
            background: #fff3cd;
            color: #856404;
        }
        .status.loading {
            background: #cce5ff;
            color: #004085;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 16px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .btn-google {
            background: #4285f4;
            color: white;
        }
        .btn-google:hover {
            background: #3367d6;
        }
        .btn-copy {
            background: #28a745;
            color: white;
            margin-top: 15px;
        }
        .btn-copy:hover {
            background: #218838;
        }
        .btn-swagger {
            background: #85ea2d;
            color: #1a1a1a;
            margin-top: 10px;
            text-decoration: none;
            text-align: center;
        }
        .btn-swagger:hover {
            background: #6fc41f;
        }
        .user-info {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .user-info p {
            margin: 8px 0;
            color: #555;
        }
        .user-info strong {
            color: #333;
        }
        .token-section {
            margin-top: 20px;
        }
        .token-section label {
            display: block;
            font-size: 12px;
            color: #666;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .token-box {
            width: 100%;
            min-height: 100px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 11px;
            word-break: break-all;
            resize: vertical;
            background: #fafafa;
        }
        .hidden {
            display: none;
        }
        .divider {
            height: 1px;
            background: #eee;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>🔑 OAuth Login Helper</h1>

            <div id="statusBox" class="status waiting">
                Google 로그인을 시작하세요
            </div>

            <div id="loginSection">
                <button class="btn btn-google" onclick="startLogin()">
                    Google 계정으로 로그인
                </button>
            </div>

            <div id="resultSection" class="hidden">
                <div class="user-info">
                    <p><strong>이름:</strong> <span id="userName">-</span></p>
                    <p><strong>역할:</strong> <span id="userRole">-</span></p>
                    <p><strong>학과:</strong> <span id="userDept">-</span></p>
                </div>

                <div class="token-section">
                    <label>Access Token</label>
                    <textarea id="accessToken" class="token-box" readonly></textarea>
                    <button class="btn btn-copy" onclick="copyToken()">
                        📋 Access Token 복사
                    </button>
                    <a href="/swagger-ui/index.html" class="btn btn-swagger" target="_blank">
                        🚀 Swagger UI 열기
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;

        window.onload = async () => {
            const params = new URLSearchParams(window.location.search);
            const code = params.get('code');
            const state = params.get('state');
            const error = params.get('error');

            if (error) {
                showError('Google 로그인 실패: ' + error);
                return;
            }

            if (code && state) {
                setStatus('loading', '토큰 교환 중...');
                await exchangeToken(code, state);
            }
        };

        async function startLogin() {
            try {
                setStatus('loading', '인증 URL 생성 중...');

                const response = await fetch(API_BASE + '/api/v1/auth/oauth/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });

                if (!response.ok) {
                    throw new Error('oauth/start 요청 실패: ' + response.status);
                }

                const data = await response.json();
                const googleAuthUrl = data.data.googleAuthUrl;

                window.location.href = googleAuthUrl;
            } catch (error) {
                showError(error.message);
            }
        }

        async function exchangeToken(code, state) {
            try {
                const response = await fetch(API_BASE + '/api/v1/auth/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code, state })
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => null);
                    throw new Error(errorData?.error?.message || '토큰 교환 실패: ' + response.status);
                }

                const data = await response.json();
                const userData = data.data;

                showResult(userData);
            } catch (error) {
                showError(error.message);
            }
        }

        function showResult(data) {
            setStatus('success', '✅ 로그인 성공!');

            document.getElementById('userName').textContent = data.name || '-';
            document.getElementById('userRole').textContent = data.role || '-';
            document.getElementById('userDept').textContent =
                (data.position && data.department) ? `${data.position} / ${data.department}` : '-';

            document.getElementById('accessToken').value = data.accessToken || '';

            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('resultSection').classList.remove('hidden');

            const newUrl = window.location.pathname;
            window.history.replaceState({}, document.title, newUrl);
        }

        function copyToken() {
            const tokenBox = document.getElementById('accessToken');
            tokenBox.select();
            tokenBox.setSelectionRange(0, 99999);

            navigator.clipboard.writeText(tokenBox.value)
                .then(() => {
                    const btn = document.querySelector('.btn-copy');
                    const original = btn.textContent;
                    btn.textContent = '✅ 복사됨!';
                    setTimeout(() => { btn.textContent = original; }, 2000);
                })
                .catch(() => {
                    document.execCommand('copy');
                });
        }

        function setStatus(type, message) {
            const statusBox = document.getElementById('statusBox');
            statusBox.className = 'status ' + type;
            statusBox.textContent = message;
        }

        function showError(message) {
            setStatus('error', '❌ ' + message);
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('resultSection').classList.add('hidden');
        }
    </script>
</body>
</html>
