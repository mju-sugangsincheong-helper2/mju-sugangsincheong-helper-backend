<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>FCM 웹 푸시 실제 알림 수신 테스트</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 40px; background-color: #f4f6f8; }
    .card { background: white; padding: 24px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); max-width: 600px; margin: 0 auto; }
    h2 { color: #111827; margin-top: 0; }
    p { color: #4b5563; line-height: 1.5; }
    button { background: #4f46e5; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; }
    button:hover { background: #4338ca; }
    textarea { width: 100%; height: 110px; margin-top: 10px; font-family: monospace; padding: 8px; border: 1px solid #d1d5db; border-radius: 4px; box-sizing: border-box; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🔔 FCM 웹 푸시 알림 수신 테스트</h2>
    <p>아래 버튼을 누르고 브라우저 알림 권한을 허용하면, 구글 FCM 서버로부터 실제 알림을 수신할 수 있는 <b>FCM Token</b>이 발급됩니다.</p>
    <button id="btn-request">알림 권한 허용 및 FCM 토큰 발급</button>
    
    <h3 style="margin-top: 24px; margin-bottom: 8px; font-size: 16px;">발급된 FCM Token:</h3>
    <textarea id="token-display" readonly placeholder="버튼을 누르면 토큰이 여기에 표시됩니다."></textarea>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-messaging-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDRPBFvXsQ6P7Gk_BfgVkYsjbYHXC_Ev-U",
      authDomain: "mju-sugangsincheong-helper.firebaseapp.com",
      projectId: "mju-sugangsincheong-helper",
      storageBucket: "mju-sugangsincheong-helper.firebasestorage.app",
      messagingSenderId: "570409366164",
      appId: "1:570409366164:web:ca2f6c38ca25d1661b3a81",
      measurementId: "G-J8XMFFEQKM"
    };

    firebase.initializeApp(firebaseConfig);
    const messaging = firebase.messaging();

    document.getElementById('btn-request').addEventListener('click', async () => {
      try {
        const permission = await Notification.requestPermission();
        if (permission === 'granted') {
          const registration = await navigator.serviceWorker.register('/firebase-messaging-sw.js');
          const token = await messaging.getToken({
            vapidKey: "BPvVPUBnjhL7D5W8i5el8R1VYH3e6GigcQTrw87fpoWJSbRRwkpTaUpzjwp3wTt_op91v3OVVgDYEZ_bjVDBINo",
            serviceWorkerRegistration: registration
          });
          
          document.getElementById('token-display').value = token;
          console.log('FCM Token:', token);
          alert('FCM 토큰 발급 성공!');
        } else {
          alert('알림 권한이 거부되었습니다.');
        }
      } catch (err) {
        console.error('FCM Token error:', err);
        alert('토큰 발급 실패: ' + err.message);
      }
    });

    messaging.onMessage((payload) => {
      console.log('포그라운드 알림 수신:', payload);
      new Notification(payload.notification.title, {
        body: payload.notification.body
      });
    });
  </script>
</body>
</html>
