spring:
  application:
    name: mjusugangsincheonghelper

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/mjusugangsincheonghelperdb_dev
    username: mjusugangsincheonghelperuser
    password: mjusugangsincheonghelperpassword

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        generate_statistics: true
        log_slow_query: 1000
    open-in-view: false

  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    root: INFO
    com.mjusugangsincheonghelper: DEBUG
    org.hibernate.SQL: DEBUG

app:
  auth:
    token-in-response: true
  jwt:
    secret: dev-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm-change-in-prod
    access-token-expiry-ms: 3600000       # 1시간
    refresh-token-expiry-ms: 604800000    # 7일
    merge-ticket-expiry-ms: 300000        # 5분
  cache:
    default-ttl: 24h
    ttls:
      room-static-meta: 0s
      user-intents: 24h
      user-room-ids: 24h
      user-unread-counts: 24h
      room-dynamic-meta: 24h
      room-active-intents: 24h
      recent-intents-page: 24h
      singlegame-rank: 5m
      singlegame-records: 5m
      singlegame-analysis: 5m
  oauth2:
    google:
      client-id: ${MJU_SUGANGSINCHEONG_HELPER_GOOGLE_CLIENT_ID}
      client-secret: ${MJU_SUGANGSINCHEONG_HELPER_GOOGLE_CLIENT_SECRET}
      redirect-uri: http://localhost:8080/auth-test.html
      authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
      token-uri: https://oauth2.googleapis.com/token

management:
  endpoints:
    web:
      exposure:
        include: "*"
