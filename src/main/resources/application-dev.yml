spring:
  application:
    name: mjusugangsincheonghelper

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/mjusugangsincheonghelperdb
    username: mjusugangsincheonghelperuser
    password: mjusugangsincheonghelperpassword

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        generate_statistics: true
        log_slow_query: 1000
    open-in-view: false

  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    root: INFO
    com.mjusugangsincheonghelper: DEBUG
    org.hibernate.SQL: DEBUG


management:
  endpoints:
    web:
      exposure:
        # include: "health,info,logfile,loggers" 
        include: "*"