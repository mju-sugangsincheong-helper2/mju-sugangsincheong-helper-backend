spring:
  application:
    name: mjusugangsincheonghelper

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/mjusugangsincheonghelperdb_dev
    username: mjusugangsincheonghelperuser
    password: mjusugangsincheonghelperpassword

  sql:
    init:
      mode: always
      schema-locations: classpath:schema-view.sql

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
      # ddl-auto: create-drop
    properties:
      hibernate:
        # show_sql: true
        # format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        generate_statistics: true
        log_slow_query: 1000
    open-in-view: false

  data:
    redis:
      host: localhost
      port: 6379
      repositories:
        enabled: false

# server:
#   tomcat:
#     threads:
#       max: 500

logging:
  level:
    root: INFO
    com.mjusugangsincheonghelper: DEBUG
    org.hibernate.SQL: DEBUG
  file:
    name: logs/${app.instance-id}-application.log

# Actuator 노출 설정 — internal_system/index.html(운영 대시보드) 및 Prometheus 모니터링용 - 내부망이므로 특별히 보안 설정 없음
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers,logfile,threaddump,httpexchanges,env,mappings,beans,configprops,caches,conditions
  endpoint:
    health:
      show-details: always
    logfile:
      # logging.file.name과 동일한 파일 지정 (명시적으로 연결)
      external-file: logs/${app.instance-id}-application.log
    # dev에서만 env 값 노출(마스킹 해제). prod는 보안상 기본값(NEVER) 유지.
    env:
      show-values: always

app:
  instance-id: ${INSTANCE_ID:app}
  cors:
    # 쉼표 구분 목록. 나중에 오리진이 바뀌면 여기만 수정하면 된다.
    allowed-origins: "http://localhost:5173,http://localhost:8000"
  auth:
    # header+cookie 동시 전달·추출: Authorization 헤더 우선 + 쿠키 폴백 (프론트는 쿠키 기반 credentials:include)
    token-mode: header, cookie
    # 로컬 HTTP 개발 환경에서는 Secure 쿠키를 브라우저가 거부할 수 있으므로 비활성화
    cookie-secure: false
    token-in-response: true
    # 쿠키 maxAge — app.jwt.* 만료와 별개로 브라우저 쿠키 수명을 제어 (jwt 만료와 맞춰서 관리)
    cookie-max-age:
      access: 1h
      refresh: 7d
    test-accounts:
      - name: "TEST_ADMIN/TEST_POSITION/TEST_DEPARTMENT"
        role: ADMIN
      - name: "TEST_MEMBER/TEST_POSITION/TEST_DEPARTMENT"
        role: MEMBER
      - name: "TEST_GUEST/TEST_POSITION/TEST_DEPARTMENT"
        role: GUEST
  jwt:
    secret: dev-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm-change-in-prod
    access-token-expiry-ms: 3600000       # 1시간
    refresh-token-expiry-ms: 604800000    # 7일
    merge-ticket-expiry-ms: 300000        # 5분
  cache:
    default-ttl: 24h
    ttls:
      system-config: 24h
      exchange-feed: 24h
      exchange-main: 24h
      exchange-user-intents: 24h
      exchange-room-meta: 24h
      singlegame-rank: 5m
      singlegame-records: 5m
      singlegame-analysis: 5m
      multigame-rank: 5m
    # evict 직후 한 번 더 삭제하는 더블 evict 지연 시간 (캐시 재구성 경합 방지)
    double-evict-delay: 2s
  singlegame:
    timing:
      t-enter-main:
        min-ms: 1
        max-ms: 60000
      t-click-course:
        min-ms: 1
        max-ms: 60000
      t-click-yes:
        min-ms: 1
        max-ms: 60000
      t-click-ok:
        min-ms: 1
        max-ms: 60000
  multigame:
    # 미운영(CLOSED) 시간대. start_close/end_close snake_case도 동일하게 바인딩된다.
    start-close: "02:00"
    end-close: "05:00"
  oauth2:
    google:
      client-id: ${MJU_SUGANGSINCHEONG_HELPER_GOOGLE_CLIENT_ID}
      client-secret: ${MJU_SUGANGSINCHEONG_HELPER_GOOGLE_CLIENT_SECRET}
      # redirect-uri: http://localhost:8080/auth-test.html
      redirect-uri: http://localhost:5173/login
      authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
      token-uri: https://oauth2.googleapis.com/token
    # OAuth state Redis 만료 시간
    state-ttl: 300s
  firebase:
    admin:
      project-id: ${MJU_SUGANGSINCHEONG_HELPER_FIREBASE_ADMIN_PROJECT_ID:}
      client-email: ${MJU_SUGANGSINCHEONG_HELPER_FIREBASE_ADMIN_CLIENT_EMAIL:}
      private-key: ${MJU_SUGANGSINCHEONG_HELPER_FIREBASE_ADMIN_PRIVATE_KEY:}
      type: ${MJU_SUGANGSINCHEONG_HELPER_FIREBASE_ADMIN_TYPE:service_account}
      private-key-id: ${MJU_SUGANGSINCHEONG_HELPER_FIREBASE_ADMIN_PRIVATE_KEY_ID:}
      client-id: ${MJU_SUGANGSINCHEONG_HELPER_FIREBASE_ADMIN_CLIENT_ID:}

