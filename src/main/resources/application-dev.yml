spring:
  application:
    name: mjusugangsincheonghelper

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/mjusugangsincheonghelperdb_dev
    username: mjusugangsincheonghelperuser
    password: mjusugangsincheonghelperpassword

  sql:
    init:
      mode: always
      schema-locations: classpath:schema-view.sql

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        generate_statistics: true
        log_slow_query: 1000
    open-in-view: false

  data:
    redis:
      host: localhost
      port: 6379
      repositories:
        enabled: false

logging:
  level:
    root: INFO
    com.mjusugangsincheonghelper: DEBUG
    org.hibernate.SQL: INFO
  file:
    name: logs/${app.instance-id}-application.log

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers,logfile,threaddump,httpexchanges,env,mappings,beans,configprops,caches,conditions
  endpoint:
    health:
      show-details: always
    logfile:
      external-file: logs/${app.instance-id}-application.log
    env:
      show-values: always

app:
  instance-id: ${INSTANCE_ID:app}
  performance:
    slow-ms: 1000
    very-slow-ms: 5000

  # ==========================================
  # 1. 보안 & 인증 영역 (Security / Auth)
  # ==========================================
  security:
    public-urls:
      - /api/*/auth/guest
      - /api/*/auth/refresh
      - /api/*/auth/login/google/merge
      - /api/*/auth/oauth/start
      - /api/*/auth/token
      - /api/*/auth/config/google
      - /api/*/auth/test-**
      - /api/*/example/**
      - /swagger-ui/**
      - /v3/api-docs/**
      - /*.html
      - /*.js
      - /actuator/**
    public-get-urls:
      - "/api/*/course/sections"
      - "/api/*/course/department"
      - "/api/*/exchange/intents/recent"
      - "/api/*/notices"
    public-post-urls: []
    public-put-urls: []
    public-patch-urls: []
    public-delete-urls: []

  cors:
    allowed-origins: "http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:8000,http://localhost:8000"

  auth:
    token-mode: header, cookie
    cookie-secure: false
    token-in-response: true
    cookie-max-age:
      access: 1h
      refresh: 7d
    test-accounts:
      - name: "TEST_ADMIN/TEST_POSITION/TEST_DEPARTMENT"
        role: ADMIN
      - name: "TEST_MEMBER/TEST_POSITION/TEST_DEPARTMENT"
        role: MEMBER
      - name: "TEST_GUEST/TEST_POSITION/TEST_DEPARTMENT"
        role: GUEST

  jwt:
    secret: dev-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm-change-in-prod
    access-token-expiry-ms: 3600000       # 1시간
    refresh-token-expiry-ms: 604800000    # 7일
    merge-ticket-expiry-ms: 300000        # 5분

  oauth2:
    google:
      client-id: ${MJU_SUGANGSINCHEONG_HELPER_GOOGLE_CLIENT_ID}
      client-secret: ${MJU_SUGANGSINCHEONG_HELPER_GOOGLE_CLIENT_SECRET}
      redirect-uri: http://localhost:5173/login
      authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
      token-uri: https://oauth2.googleapis.com/token
    state-ttl: 300s

  # ==========================================
  # 2. 글로벌 코어 인프라 (Scheduling / Cache)
  # ==========================================
  scheduling:
    task:
      pool-size: 2
      thread-name-prefix: "global-scheduler-"
    pgmq:
      pool-size: 2
      thread-name-prefix: "pgmq-worker-"
    multigame:
      pool-size: 1
      thread-name-prefix: "multigame-scheduler-"

  cache:
    double-evict-delay: 2s
    default-ttl: 24h
    ttls:
      system-config: 24h
      exchange-feed: 24h
      exchange-main: 24h
      exchange-user-intents: 24h
      exchange-room-meta: 24h
      singlegame-rank: 5m
      singlegame-records: 5m
      singlegame-analysis: 5m
      multigame-rank: 5m

  # ==========================================
  # 3. 비동기 메시징 & 외부 서비스 (PGMQ / Firebase)
  # ==========================================
  pgmq:
    archive-cleanup-cron: "0 30 3 * * *"
    notification:
      queue-name: "notification_queue"
      poll-interval: 1s
      visibility-timeout: 30
      batch-size: 400
      max-retry-count: 5
    cycle-detection:
      queue-name: "exchange_cycle_detection"
      poll-interval: 1s
      visibility-timeout: 30
      batch-size: 1
      max-retry-count: 5

  firebase:
    admin:
      project-id: ${MJU_SUGANGSINCHEONG_HELPER_FIREBASE_ADMIN_PROJECT_ID:}
      client-email: ${MJU_SUGANGSINCHEONG_HELPER_FIREBASE_ADMIN_CLIENT_EMAIL:}
      private-key: ${MJU_SUGANGSINCHEONG_HELPER_FIREBASE_ADMIN_PRIVATE_KEY:}
      type: ${MJU_SUGANGSINCHEONG_HELPER_FIREBASE_ADMIN_TYPE:service_account}
      private-key-id: ${MJU_SUGANGSINCHEONG_HELPER_FIREBASE_ADMIN_PRIVATE_KEY_ID:}
      client-id: ${MJU_SUGANGSINCHEONG_HELPER_FIREBASE_ADMIN_CLIENT_ID:}

  # ==========================================
  # 4. 비즈니스 도메인 설정 (Singlegame / Multigame)
  # ==========================================
  singlegame:
    timing:
      t-enter-main:
        min-ms: 1
        max-ms: 60000
      t-click-course:
        min-ms: 1
        max-ms: 60000
      t-click-yes:
        min-ms: 1
        max-ms: 60000
      t-click-ok:
        min-ms: 1
        max-ms: 60000

  multigame:
    start-close: "02:00"
    end-close: "05:00"
    schedule:
      game-ready-cron: "55 9/10 * * * *"
      game-start-cron: "0 0/10 * * * *"
      game-finish-cron: "30 0/10 * * * *"
    supply:
      total-ramp-up-duration: 30s
      step-sleep-interval: 1s
