spring:
  application:
    name: mjusugangsincheonghelper

  datasource:
    # 운영 DB 접속 정보 — .env → docker-compose-prod.yml 환경변수 → 여기서 치환
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  sql:
    init:
      # 스키마는 docker-compose-prod.yml 의 db-setup 이 psql 로 적용한다.
      # (Spring의 SQL 스크립트 파서는 schema-prod.sql 의 DO $$ 블록을 지원하지 않음)
      mode: never

  jpa:
    hibernate:
      ddl-auto: validate  # 운영에서는 스키마 자동 생성/수정 금지. db-setup 결과와 일치하는지만 검증
    properties:
      hibernate:
        log_slow_query: 1000  # 1초 이상 걸린 쿼리를 로그에 남김
    open-in-view: false  # OSIV 비활성화: 뷰 렌더링까지 DB 커넥션을 붙잡지 않음

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false  # Spring Data Redis 리포지토리 미사용 (RedisTemplate 으로 직접 접근)
  
  # threads:
  #   virtual:
  #     enabled: true

server:
  tomcat:
    threads:
      min-spare: 5

logging:
  level:
    root: INFO
    com.mjusugangsincheonghelper: INFO
  file:
    name: logs/${app.instance-id}-application.log  # 컨테이너 내 /app/logs → compose 가 ./logs 에 마운트

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers,logfile,threaddump,httpexchanges,env,mappings,beans,configprops,caches,conditions
  endpoint:
    health:
      show-details: always
    logfile:
      external-file: logs/${app.instance-id}-application.log
  info:
    env:
      enabled: true

springdoc:
  # 운영에서는 API 문서 비공개 (swagger-ui, /v3/api-docs off)
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  instance-id: ${INSTANCE_ID:app}  # 로그 파일명 등 인스턴스 구분자 (compose 에서 backend 로 주입)
  # expose-error-details: false
  performance:
    slow-ms: 1000
    very-slow-ms: 5000

  # ==========================================
  # 1. 보안 & 인증 영역 (Security / Auth)
  # ==========================================
  security:
    public-urls:
      # 인증 없이 접근 가능한 경로 (게스트 로그인/토큰 갱신/OAuth 시작·콜백/헬스체크)
      - /api/*/auth/guest
      - /api/*/auth/refresh
      - /api/*/auth/login/google/merge
      - /api/*/auth/oauth/start
      - /api/*/auth/token
      - /api/*/auth/config/google
      # - /api/*/example/**
      # - /swagger-ui/**
      # - /v3/api-docs/**
      # - /*.html
      # - /*.js
      - /actuator/**
    public-get-urls:
      # GET 한정 인증 없이 허용 (조회성 공개 API)
      - "/api/*/course/sections"
      - "/api/*/course/department"
      - "/api/*/exchange/intents/recent"
      - "/api/*/notices"
    public-post-urls: []
    public-put-urls: []
    public-patch-urls: []
    public-delete-urls: []

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://xn--hq1b21kh2g.com}

  auth:
    token-mode: cookie  # JWT 를 헤더가 아닌 HttpOnly 쿠키로 전달 (XSS 방어)
    cookie-secure: true  # HTTPS 에서만 쿠키 전송
    cookie-max-age:
      access: 1h
      refresh: 7d

  jwt:
    secret: ${JWT_SECRET}  # .env 에서 주입 (256bit 이상 필수)
    access-token-expiry-ms: 3600000        # 1시간
    refresh-token-expiry-ms: 604800000     # 7일
    merge-ticket-expiry-ms: 300000         # 계정 병합 티켓 유효기간 5분

  oauth2:
    google:
      client-id: ${MJU_SUGANGSINCHEONG_HELPER_GOOGLE_CLIENT_ID:}
      client-secret: ${MJU_SUGANGSINCHEONG_HELPER_GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${MJU_SUGANGSINCHEONG_HELPER_GOOGLE_REDIRECT_URI:https://xn--hq1b21kh2g.com/login}
      authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
      token-uri: https://oauth2.googleapis.com/token
    state-ttl: 300s

  # ==========================================
  # 2. 글로벌 코어 인프라 (Scheduling / Cache)
  # ==========================================
  scheduling:
    task:
      pool-size: 2
      thread-name-prefix: "global-scheduler-"
    pgmq:
      pool-size: 2  # PGMQ 폴링 워커 스레드 수
      thread-name-prefix: "pgmq-worker-"
    multigame:
      pool-size: 1
      thread-name-prefix: "multigame-scheduler-"

  cache:
    double-evict-delay: 2s  # (교환 로직) 이중 캐시 무효화 간격
    default-ttl: 24h
    ttls:
      system-config: 24h
      exchange-feed: 24h
      exchange-main: 24h
      exchange-user-intents: 24h
      exchange-room-meta: 24h
      singlegame-rank: 5m
      singlegame-stats: 5m
      multigame-rank: 5m

  # ==========================================
  # 3. 비동기 메시징 & 외부 서비스 (PGMQ / Firebase)
  # ==========================================
  pgmq:
    archive-cleanup-cron: "0 30 3 * * *"  # 매일 03:30 처리 완료 메시지 아카이브 정리
    notification:
      queue-name: "notification_queue"
      poll-interval: 1s
      visibility-timeout: 30   # 소비 후 재시도 대기 시간(초)
      batch-size: 400
      max-retry-count: 5
    cycle-detection:
      queue-name: "exchange_cycle_detection"
      poll-interval: 1s
      visibility-timeout: 30
      batch-size: 1  # 교환 사이클 감지는 순차 처리
      max-retry-count: 5

  firebase:
    admin:
      project-id: ${MJU_SUGANGSINCHEONG_HELPER_FIREBASE_ADMIN_PROJECT_ID:}
      client-email: ${MJU_SUGANGSINCHEONG_HELPER_FIREBASE_ADMIN_CLIENT_EMAIL:}
      private-key: ${MJU_SUGANGSINCHEONG_HELPER_FIREBASE_ADMIN_PRIVATE_KEY:}
      type: ${MJU_SUGANGSINCHEONG_HELPER_FIREBASE_ADMIN_TYPE:service_account}
      private-key-id: ${MJU_SUGANGSINCHEONG_HELPER_FIREBASE_ADMIN_PRIVATE_KEY_ID:}
      client-id: ${MJU_SUGANGSINCHEONG_HELPER_FIREBASE_ADMIN_CLIENT_ID:}

  # ==========================================
  # 4. 비즈니스 도메인 설정 (Singlegame / Multigame)
  # ==========================================
  singlegame:
    timing:
      t-enter-main:
        min-ms: 1
        max-ms: 60000
      t-click-course:
        min-ms: 1
        max-ms: 60000
      t-click-yes:
        min-ms: 1
        max-ms: 60000
      t-click-ok:
        min-ms: 1
        max-ms: 60000

  multigame:
    start-close: "02:00:00+09:00"
    end-close: "05:00:00+09:00"
    schedule:
      game-ready-cron: "55 9/10 * * * *"
      game-start-cron: "0 0/10 * * * *"
      game-finish-cron: "30 0/10 * * * *"
    supply:
      total-ramp-up-duration: 30s
      step-sleep-interval: 1s