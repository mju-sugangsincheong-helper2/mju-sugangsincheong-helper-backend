spring:
  application:
    name: mjusugangsincheonghelper

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  sql:
    init:
      mode: always
      schema-locations: classpath:schema-prod.sql

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        log_slow_query: 1000
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Redis Repository 스캔 비활성 (리포 전부 JPA — Redis 는 캐시/템플릿 전용)
      repositories:
        enabled: false

app:
  instance-id: ${INSTANCE_ID:app}
  cors:
    # https://명수도.com → https://xn--hq1b21kh2g.com
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://xn--hq1b21kh2g.com}
  auth:
    token-mode: cookie   # cookie: HttpOnly+Secure 쿠키만 전달·추출 (oper/prod)
    cookie-secure: true  # HTTPS 필수 환경 Secure 쿠키 활성화
    # 쿠키 maxAge — app.jwt.* 만료와 별개로 브라우저 쿠키 수명을 제어 (jwt 만료와 맞춰서 관리)
    cookie-max-age:
      access: 1h
      refresh: 7d
  expose-error-details: false
  performance:
    slow-ms: 1000
    very-slow-ms: 5000
  cache:
    default-ttl: 24h
    ttls:
      system-config: 24h
      exchange-feed: 24h
      exchange-main: 24h
      exchange-user-intents: 24h
      exchange-room-meta: 24h
      singlegame-rank: 5m
      singlegame-records: 5m
      singlegame-analysis: 5m
      multigame-rank: 5m
    # evict 직후 한 번 더 삭제하는 더블 evict 지연 시간 (캐시 재구성 경합 방지)
    double-evict-delay: 2s
  singlegame:
    timing:
      t-enter-main:
        min-ms: 1
        max-ms: 60000
      t-click-course:
        min-ms: 1
        max-ms: 60000
      t-click-yes:
        min-ms: 1
        max-ms: 60000
      t-click-ok:
        min-ms: 1
        max-ms: 60000
  multigame:
    # 미운영(CLOSED) 시간대. start_close/end_close snake_case도 동일하게 바인딩된다.
    start-close: "02:00"
    end-close: "05:00"
  firebase:
    admin:
      project-id: ${MJU_SUGANGSINCHEONG_HELPER_FIREBASE_ADMIN_PROJECT_ID:}
      client-email: ${MJU_SUGANGSINCHEONG_HELPER_FIREBASE_ADMIN_CLIENT_EMAIL:}
      private-key: ${MJU_SUGANGSINCHEONG_HELPER_FIREBASE_ADMIN_PRIVATE_KEY:}
      type: ${MJU_SUGANGSINCHEONG_HELPER_FIREBASE_ADMIN_TYPE:service_account}
      private-key-id: ${MJU_SUGANGSINCHEONG_HELPER_FIREBASE_ADMIN_PRIVATE_KEY_ID:}
      client-id: ${MJU_SUGANGSINCHEONG_HELPER_FIREBASE_ADMIN_CLIENT_ID:}

logging:
  level:
    root: INFO
    com.mjusugangsincheonghelper: INFO
  file:
    name: logs/${app.instance-id}-application.log

# Actuator 노출 설정 — internal_system/index.html(운영 대시보드) 및 Prometheus 모니터링용 - 내부망이므로 특별히 보안 설정 없음
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers,logfile,threaddump,httpexchanges,env,mappings,beans,configprops,caches,conditions
  endpoint:
    health:
      show-details: always
    logfile:
      # logging.file.name과 동일한 파일 지정 (명시적으로 연결)
      external-file: logs/${app.instance-id}-application.log

springdoc:
  # prod Swagger/OpenAPI 비활성화.
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

