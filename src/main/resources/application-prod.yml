spring:
  application:
    name: mjusugangsincheonghelper

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  sql:
    init:
      mode: always
      schema-locations: classpath:schema-prod.sql

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  instance-id: ${INSTANCE_ID:app}
  expose-error-details: false
  performance:
    slow-ms: 1000
    very-slow-ms: 5000
  cache:
    default-ttl: 24h
    ttls:
      system-config: 24h
      exchange-feed: 10m
      exchange-intents: 10m
      exchange-rooms: 10m
      singlegame-rank: 5m
      singlegame-records: 5m
      singlegame-analysis: 5m
      multigame-department-participation: 5m
      multigame-department-success-rate: 5m
  singlegame:
    reaction-time-min-ms: 1
    reaction-time-max-ms: 60000
  multigame:
    # 미운영(CLOSED) 시간대. start_close/end_close snake_case도 동일하게 바인딩된다.
    start-close: "02:00"
    end-close: "05:00"
  firebase:
    admin:
      project-id: ${MJU_SUGANGSINCHEONG_HELPER_FIREBASE_ADMIN_PROJECT_ID:}
      client-email: ${MJU_SUGANGSINCHEONG_HELPER_FIREBASE_ADMIN_CLIENT_EMAIL:}
      private-key: ${MJU_SUGANGSINCHEONG_HELPER_FIREBASE_ADMIN_PRIVATE_KEY:}
      type: ${MJU_SUGANGSINCHEONG_HELPER_FIREBASE_ADMIN_TYPE:service_account}
      private-key-id: ${MJU_SUGANGSINCHEONG_HELPER_FIREBASE_ADMIN_PRIVATE_KEY_ID:}
      client-id: ${MJU_SUGANGSINCHEONG_HELPER_FIREBASE_ADMIN_CLIENT_ID:}

logging:
  level:
    root: INFO
    com.mjusugangsincheonghelper: INFO
  file:
    name: logs/${app.instance-id}-application.log

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers,logfile,threaddump
  endpoint:
    health:
      show-details: when_authorized
      roles: ADMIN
