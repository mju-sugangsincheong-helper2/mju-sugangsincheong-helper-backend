spring:
  application:
    name: mjusugangsincheonghelper

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  sql:
    init:
      mode: always
      schema-locations: classpath:schema-prod.sql

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  expose-error-details: false
  performance:
    slow-ms: 1000
    very-slow-ms: 5000
  cache:
    default-ttl: 24h
    ttls:
      system-config: 24h
      exchange-feed: 10m
      exchange-intents: 10m
      exchange-rooms: 10m
      singlegame-rank: 5m
      singlegame-records: 5m
      singlegame-analysis: 5m
  singlegame:
    reaction-time-min-ms: 1
    reaction-time-max-ms: 60000

logging:
  level:
    root: INFO
    com.mjusugangsincheonghelper: INFO
