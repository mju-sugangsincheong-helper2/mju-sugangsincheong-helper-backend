spring:
  application:
    name: mjusugangsincheonghelper

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  sql:
    init:
      mode: always
      schema-locations: classpath:schema-prod.sql

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        log_slow_query: 1000
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false

logging:
  level:
    root: INFO
    com.mjusugangsincheonghelper: INFO
  file:
    name: logs/${app.instance-id}-application.log

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers,logfile,threaddump,httpexchanges,env,mappings,beans,configprops,caches,conditions
  endpoint:
    health:
      show-details: always
    logfile:
      external-file: logs/${app.instance-id}-application.log

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  instance-id: ${INSTANCE_ID:app}
  # expose-error-details: false
  performance:
    slow-ms: 1000
    very-slow-ms: 5000

  # ==========================================
  # 1. 보안 & 인증 영역 (Security / Auth)
  # ==========================================
  security:
    public-urls:
      - /api/*/auth/guest
      - /api/*/auth/refresh
      - /api/*/auth/login/google/merge
      - /api/*/auth/oauth/start
      - /api/*/auth/token
      - /api/*/auth/config/google
      # - /api/*/example/**
      # - /swagger-ui/**
      # - /v3/api-docs/**
      # - /*.html
      # - /*.js
      - /actuator/**
    public-get-urls:
      - "/api/*/course/sections"
      - "/api/*/course/department"
      - "/api/*/exchange/intents/recent"
      - "/api/*/notices"
    public-post-urls: []
    public-put-urls: []
    public-patch-urls: []
    public-delete-urls: []

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://xn--hq1b21kh2g.com}

  auth:
    token-mode: cookie
    cookie-secure: true
    cookie-max-age:
      access: 1h
      refresh: 7d

  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry-ms: 3600000
    refresh-token-expiry-ms: 604800000
    merge-ticket-expiry-ms: 300000

  oauth2:
    google:
      client-id: ${MJU_SUGANGSINCHEONG_HELPER_GOOGLE_CLIENT_ID:}
      client-secret: ${MJU_SUGANGSINCHEONG_HELPER_GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${MJU_SUGANGSINCHEONG_HELPER_GOOGLE_REDIRECT_URI:https://xn--hq1b21kh2g.com/login}
      authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
      token-uri: https://oauth2.googleapis.com/token
    state-ttl: 300s

  # ==========================================
  # 2. 글로벌 코어 인프라 (Scheduling / Cache)
  # ==========================================
  scheduling:
    task:
      pool-size: 2
      thread-name-prefix: "global-scheduler-"
    pgmq:
      pool-size: 2
      thread-name-prefix: "pgmq-worker-"
    multigame:
      pool-size: 1
      thread-name-prefix: "multigame-scheduler-"

  cache:
    double-evict-delay: 2s
    default-ttl: 24h
    ttls:
      system-config: 24h
      exchange-feed: 24h
      exchange-main: 24h
      exchange-user-intents: 24h
      exchange-room-meta: 24h
      singlegame-rank: 5m
      singlegame-records: 5m
      multigame-rank: 5m

  # ==========================================
  # 3. 비동기 메시징 & 외부 서비스 (PGMQ / Firebase)
  # ==========================================
  pgmq:
    archive-cleanup-cron: "0 30 3 * * *"
    notification:
      queue-name: "notification_queue"
      poll-interval: 1s
      visibility-timeout: 30
      batch-size: 400
      max-retry-count: 5
    cycle-detection:
      queue-name: "exchange_cycle_detection"
      poll-interval: 1s
      visibility-timeout: 30
      batch-size: 1
      max-retry-count: 5

  firebase:
    admin:
      project-id: ${MJU_SUGANGSINCHEONG_HELPER_FIREBASE_ADMIN_PROJECT_ID:}
      client-email: ${MJU_SUGANGSINCHEONG_HELPER_FIREBASE_ADMIN_CLIENT_EMAIL:}
      private-key: ${MJU_SUGANGSINCHEONG_HELPER_FIREBASE_ADMIN_PRIVATE_KEY:}
      type: ${MJU_SUGANGSINCHEONG_HELPER_FIREBASE_ADMIN_TYPE:service_account}
      private-key-id: ${MJU_SUGANGSINCHEONG_HELPER_FIREBASE_ADMIN_PRIVATE_KEY_ID:}
      client-id: ${MJU_SUGANGSINCHEONG_HELPER_FIREBASE_ADMIN_CLIENT_ID:}

  # ==========================================
  # 4. 비즈니스 도메인 설정 (Singlegame / Multigame)
  # ==========================================
  singlegame:
    timing:
      t-enter-main:
        min-ms: 1
        max-ms: 60000
      t-click-course:
        min-ms: 1
        max-ms: 60000
      t-click-yes:
        min-ms: 1
        max-ms: 60000
      t-click-ok:
        min-ms: 1
        max-ms: 60000

  multigame:
    start-close: "02:00"
    end-close: "05:00"
    schedule:
      game-ready-cron: "55 9/10 * * * *"
      game-start-cron: "0 0/10 * * * *"
      game-finish-cron: "30 0/10 * * * *"
    supply:
      total-ramp-up-duration: 30s
      step-sleep-interval: 1s
