# 개발 환경 docker compose
# DB: postgres:17 + pgmq 확장 (prod와 동일 빌드)
# dev 전용 도구: pgadmin(:8005), redis-commander(:8006)
# 데이터: named volume 사용 (docker volume rm 으로 초기화 가능)

x-variables:
  # ── DB 식별자 ──
  postgres_db_name: &POSTGRES_DB_NAME "postgres"
  postgres_user: &POSTGRES_USER "postgres"
  postgres_password: &POSTGRES_PASSWORD "postgrespassword"
  db_user: &DB_USER "mjusugangsincheonghelperuser"
  db_password: &DB_PASSWORD "mjusugangsincheonghelperpassword"
  dev_db_name: &DEV_DB_NAME "mjusugangsincheonghelperdb_dev"
  test_db_name: &TEST_DB_NAME "mjusugangsincheonghelperdb_test"

  # ── pgadmin 접속 정보 ──
  pgadmin_email: &PGADMIN_EMAIL "admin@admin.com"
  pgadmin_password: &PGADMIN_PASSWORD "1253"

  # ── 컨테이너 이름 ──
  postgres_container: &POSTGRES_CONTAINER "mju-sugangsincheong-helper-postgres"
  db_setup_container: &DB_SETUP_CONTAINER "mju-sugangsincheong-helper-db-setup"
  pgadmin_container: &PGADMIN_CONTAINER "mju-sugangsincheong-helper-pgadmin"
  redis_container: &REDIS_CONTAINER "mju-sugangsincheong-helper-redis"
  redis_commander_container: &REDIS_COMMANDER_CONTAINER "mju-sugangsincheong-helper-redis-commander"

  # ── 인라인 Dockerfile: postgres:17 + pgmq + pg_cron 확장 ──
  # 앱이 메시지 큐로 pgmq를 사용하고, pg_cron으로 스케줄링을 수행하므로
  # 두 확장 모두 포함된 이미지가 필수 (prod와 동일)
  postgres_with_pgmq_inline_dockerfile: &POSTGRES_WITH_PGMQ_INLINE_DOCKERFILE |
    FROM postgres:17
    USER root
    RUN apt-get update && apt-get install -y --no-install-recommends \
          postgresql-17-cron \
          postgresql-server-dev-17 make gcc git ca-certificates \
        && rm -rf /var/lib/apt/lists/* \
        && git clone https://github.com/pgmq/pgmq.git /tmp/pgmq \
        && cd /tmp/pgmq/pgmq-extension && make install \
        && rm -rf /tmp/pgmq \
        && apt-get purge -y --auto-remove make gcc git postgresql-server-dev-17 \
        && rm -rf /var/lib/apt/lists/*
    USER postgres

services:
  # ── PostgreSQL 17 + pgmq + pg_cron ──
  db:
    build:
      context: .
      dockerfile_inline: *POSTGRES_WITH_PGMQ_INLINE_DOCKERFILE
    container_name: *POSTGRES_CONTAINER
    environment:
      POSTGRES_DB: *POSTGRES_DB_NAME  # 초기 DB, 실제 dev/test DB는 db-setup이 생성
      POSTGRES_USER: *POSTGRES_USER
      POSTGRES_PASSWORD: *POSTGRES_PASSWORD
      PGPASSWORD: *POSTGRES_PASSWORD
    ports:
      - "5432:5432"  # IDE/로컬 psql 직접 접속용
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # pg_cron을 shared_preload_libraries에 추가하고 사용할 데이터베이스 지정
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements,pg_cron", "-c", "cron.database_name=postgres"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  # ── DB 초기화 (1회성) ──
  # db healthy 후 실행되어 아래 작업을 멱등 수행 후 자동 종료:
  #   1. 앱 전용 Role 생성 (없으면)
  #   2. dev DB 생성 + pgmq 확장 활성화
  #   3. test DB 생성 + pgmq 확장 활성화
  #   4. Role의 search_path 설정
  # 재실행해도 안전 (존재 여부 체크 후 생성)
  db-setup:
    image: postgres:17
    container_name: *DB_SETUP_CONTAINER
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: *POSTGRES_USER
      POSTGRES_PASSWORD: *POSTGRES_PASSWORD
      POSTGRES_DB_NAME: *POSTGRES_DB_NAME
      DB_USER: *DB_USER
      DB_PASSWORD: *DB_PASSWORD
      DEV_DB_NAME: *DEV_DB_NAME
      TEST_DB_NAME: *TEST_DB_NAME
      PGPASSWORD: *POSTGRES_PASSWORD
    depends_on:
      db:
        condition: service_healthy
    command: |
      bash -c "
        set -e
        until pg_isready -h $$POSTGRES_HOST -U $$POSTGRES_USER; do
          sleep 1
        done
        echo 'PostgreSQL is up - executing setup commands...'

        # 1. Role 생성 (멱등)
        psql -h $$POSTGRES_HOST -U $$POSTGRES_USER -d $$POSTGRES_DB_NAME -tAc \"SELECT 1 FROM pg_roles WHERE rolname='$$DB_USER'\" | grep -q 1 || \
        psql -h $$POSTGRES_HOST -U $$POSTGRES_USER -d $$POSTGRES_DB_NAME -c \"CREATE ROLE $$DB_USER WITH LOGIN PASSWORD '$$DB_PASSWORD' SUPERUSER;\"

        # 2. dev DB 생성 + pgmq 확장 활성화
        if ! psql -h $$POSTGRES_HOST -U $$POSTGRES_USER -d $$POSTGRES_DB_NAME -tAc \"SELECT 1 FROM pg_database WHERE datname='$$DEV_DB_NAME'\" | grep -q 1; then
          echo 'Creating dev database...'
          psql -h $$POSTGRES_HOST -U $$POSTGRES_USER -d $$POSTGRES_DB_NAME -c \"CREATE DATABASE $$DEV_DB_NAME OWNER $$DB_USER;\"
          psql -h $$POSTGRES_HOST -U $$POSTGRES_USER -d $$DEV_DB_NAME -c \"CREATE EXTENSION IF NOT EXISTS pgmq;\"
          psql -h $$POSTGRES_HOST -U $$POSTGRES_USER -d $$DEV_DB_NAME -c \"ALTER DATABASE $$DEV_DB_NAME SET search_path TO public;\"
        fi

        # 3. test DB 생성 + pgmq 확장 활성화
        if ! psql -h $$POSTGRES_HOST -U $$POSTGRES_USER -d $$POSTGRES_DB_NAME -tAc \"SELECT 1 FROM pg_database WHERE datname='$$TEST_DB_NAME'\" | grep -q 1; then
          echo 'Creating test database...'
          psql -h $$POSTGRES_HOST -U $$POSTGRES_USER -d $$POSTGRES_DB_NAME -c \"CREATE DATABASE $$TEST_DB_NAME OWNER $$DB_USER;\"
          psql -h $$POSTGRES_HOST -U $$POSTGRES_USER -d $$TEST_DB_NAME -c \"CREATE EXTENSION IF NOT EXISTS pgmq;\"
          psql -h $$POSTGRES_HOST -U $$POSTGRES_USER -d $$TEST_DB_NAME -c \"ALTER DATABASE $$TEST_DB_NAME SET search_path TO public;\"
        fi

        # 4. Role의 search_path 설정
        psql -h $$POSTGRES_HOST -U $$POSTGRES_USER -d $$POSTGRES_DB_NAME -c \"ALTER ROLE $$DB_USER SET search_path TO public;\"
        echo 'Database setup complete!'
      "
    restart: "no"

  # ── pgadmin (PostgreSQL 웹 UI) — http://localhost:8005 ──
  pgadmin:
    build:
      context: ./docker/pgadmin
      dockerfile: Dockerfile
    container_name: *PGADMIN_CONTAINER
    environment:
      PGADMIN_DEFAULT_EMAIL: *PGADMIN_EMAIL
      PGADMIN_DEFAULT_PASSWORD: *PGADMIN_PASSWORD
    ports:
      - "8005:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db
    restart: always

  # ── Redis 7 ──
  # 로컬 캐시/세션용, 인증 없음 (localhost 전용)
  redis:
    image: redis:7-alpine
    container_name: *REDIS_CONTAINER
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: always

  # ── Redis 관리 UI — http://localhost:8006 ──
  redis-commander:
    image: ghcr.io/joeferner/redis-commander:latest
    container_name: *REDIS_COMMANDER_CONTAINER
    environment:
      REDIS_HOSTS: "local:redis:6379"
    ports:
      - "8006:8081"
    depends_on:
      - redis
    restart: always

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
